<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valorant Hub</title>
</head>

<body>
    <header>
        <h1>Valorant Hub</h1>
    </header>

    <main>
        <section>
            <h2>Sobre o Valorant Hub</h2>
            <p>O Valorant Hub apresenta informações sobre agentes, mapas e armas do jogo Valorant.</p>
            <ul>
                <li>Agentes</li>
                <li>Mapas</li>
                <li>Armas</li>
            </ul>

            <a href="https://playvalorant.com/pt-br/" target="_blank" rel="noopener noreferrer">
                Site oficial do Valorant
            </a>

            <img src="assets/images/images.jpg" alt="Imagem relacionada ao jogo Valorant" style="width: 80%; height: auto;">
        </section>
        <div>
            <video controls style="width: 60%; max-width: 1280px; height: auto;">
                <source src="assets/videos/video valorant2.mp4" type="video/mp4">
            </video>
        </div>
        <section>
            <h2>Agentes</h2>
            <table>
                <tr>
                    <th>Agente</th>
                    <th>Função</th>
                </tr>
                <tr>
                    <td>Jett</td>
                    <td>Duelista</td>
                </tr>
                <tr>
                    <td>Sage</td>
                    <td>Sentinela</td>
                </tr>
            </table>
        </section>

        <section>
            <h2>Avalie um agente</h2>
            <form>
                <fieldset>
                    <legend>Informações do Avaliador</legend>
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" required>
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required>

                <label for="agente">Agente:</label>
                <input type="text" id="agente" name="agente">

                <label for="nota">Nota de 1 a 10:</label>
                <input type="number" id="nota" name="nota" min="1" max="10">
                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        <p>Valorant Hub</p>
    </footer>

</body>
</html>
